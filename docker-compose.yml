version: '3.8'

services:
  # Database Service (MySQL 8.0)
  db_cibenda:
    image: mysql:8.0
    container_name: cibenda_mysql
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-cibenda_mart}
      MYSQL_USER: ${DB_USERNAME:-cibenda_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache, Session & Queue Store (Redis)
  redis_cibenda:
    image: redis:alpine
    container_name: cibenda_redis
    restart: unless-stopped
    command: redis-server --appendonly no --save ""
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application Web Server (Laravel 11 + Inertia + React)
  app_cibenda:
    build: .
    container_name: cibenda_app
    restart: unless-stopped
    command: >-
      sh -c "php artisan config:clear &&
             php artisan storage:link --force &&
             php artisan migrate --force &&
             php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env.docker
    environment:
      - DB_HOST=db_cibenda
      - DB_PORT=3306
      - DB_DATABASE=cibenda_mart
      - DB_USERNAME=cibenda_user
      - DB_PASSWORD=${DB_PASSWORD}
      - REVERB_SERVER_HOST=reverb_cibenda
      - REVERB_SERVER_PORT=8080
      - REVERB_SERVER_SCHEME=http
      - REDIS_HOST=redis_cibenda
      - REDIS_CLIENT=predis
      - REDIS_PORT=6379
    volumes:
      - storage_data:/var/www/storage/app/public
    depends_on:
      db_cibenda:
        condition: service_healthy
      redis_cibenda:
        condition: service_healthy

  # Background Queue Worker (Notifications, Emails & Async Jobs)
  queue_cibenda:
    build: .
    container_name: cibenda_queue
    restart: unless-stopped
    command: sh -c "php artisan config:clear && php artisan queue:work --tries=3 --sleep=3 --timeout=90"
    env_file:
      - .env.docker
    environment:
      - DB_HOST=db_cibenda
      - DB_PORT=3306
      - DB_DATABASE=cibenda_mart
      - DB_USERNAME=cibenda_user
      - DB_PASSWORD=${DB_PASSWORD}
      - REVERB_SERVER_HOST=reverb_cibenda
      - REVERB_SERVER_PORT=8080
      - REVERB_SERVER_SCHEME=http
      - REDIS_HOST=redis_cibenda
      - REDIS_CLIENT=predis
      - REDIS_PORT=6379
    volumes:
      - storage_data:/var/www/storage/app/public
    depends_on:
      db_cibenda:
        condition: service_healthy
      redis_cibenda:
        condition: service_healthy
      app_cibenda:
        condition: service_started

  # WebSocket Server (Laravel Reverb Real-time Sync)
  reverb_cibenda:
    build: .
    container_name: cibenda_reverb
    restart: unless-stopped
    command: sh -c "php artisan config:clear && php artisan reverb:start --host=0.0.0.0 --port=8080"
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env.docker
    environment:
      - DB_HOST=db_cibenda
      - DB_PORT=3306
      - DB_DATABASE=cibenda_mart
      - DB_USERNAME=cibenda_user
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis_cibenda
      - REDIS_CLIENT=predis
      - REDIS_PORT=6379
    depends_on:
      db_cibenda:
        condition: service_healthy
      redis_cibenda:
        condition: service_healthy
      app_cibenda:
        condition: service_started

volumes:
  db_data:
  storage_data:
