version: '3.8'

services:

  # ──────────────────────────────────────────────
  # 1. DATABASE MYSQL 8.0
  # ──────────────────────────────────────────────
  db_cibenda:
    image: mysql:8.0
    container_name: cibenda_mysql
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-cibenda_mart}
      MYSQL_USER: ${DB_USERNAME:-cibenda_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      # Data MySQL disimpen disini biar ga hilang kalau container direstart
      - db_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306" # Bind to localhost only to prevent exposure to public internet
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # 1b. REDIS CACHE, SESSION & QUEUE (In-Memory)
  # ──────────────────────────────────────────────
  redis_cibenda:
    image: redis:alpine
    container_name: cibenda_redis
    restart: unless-stopped
    command: redis-server --appendonly no --save ""
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ──────────────────────────────────────────────
  # 2. WEB SERVER - Laravel (Artisan Serve)
  # ──────────────────────────────────────────────
  app_cibenda:
    build: .
    container_name: cibenda_app
    restart: unless-stopped
    # storage:link dijalankan setiap startup biar symlink tetap valid meski volume di-mount ulang
    command: >-
      sh -c "php artisan storage:link --force &&
             php artisan migrate --force &&
             php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      - DB_HOST=db_cibenda      # Nunjuk ke nama service MySQL di atas
      - DB_PORT=3306
      - DB_DATABASE=cibenda_mart
      - DB_USERNAME=cibenda_user
      - DB_PASSWORD=${DB_PASSWORD}
      - REVERB_SERVER_HOST=reverb_cibenda
      - REVERB_HOST=reverb_cibenda
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
      - REDIS_HOST=redis_cibenda
      - REDIS_CLIENT=predis
      - REDIS_PORT=6379
    volumes:
      # Mount folder storage biar file upload (foto profil, dll) persisten
      - storage_data:/var/www/storage/app/public
    depends_on:
      db_cibenda:
        condition: service_healthy
      redis_cibenda:
        condition: service_healthy

  # ──────────────────────────────────────────────
  # 3. QUEUE WORKER - Buat notifikasi FCM & Email Resend
  # ──────────────────────────────────────────────
  queue_cibenda:
    build: .
    container_name: cibenda_queue
    restart: unless-stopped
    # Queue worker: proses 1 job per batch, retry 3x, sleep 3 detik
    command: php artisan queue:work --tries=3 --sleep=3 --timeout=90
    env_file:
      - .env.docker
    environment:
      - DB_HOST=db_cibenda
      - DB_PORT=3306
      - DB_DATABASE=cibenda_mart
      - DB_USERNAME=cibenda_user
      - DB_PASSWORD=${DB_PASSWORD}
      - REVERB_SERVER_HOST=reverb_cibenda
      - REVERB_HOST=reverb_cibenda
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
      - REDIS_HOST=redis_cibenda
      - REDIS_CLIENT=predis
      - REDIS_PORT=6379
    volumes:
      - storage_data:/var/www/storage/app/public
    depends_on:
      db_cibenda:
        condition: service_healthy
      redis_cibenda:
        condition: service_healthy
      app_cibenda:
        condition: service_started

  # ──────────────────────────────────────────────
  # 4. REVERB WEBSOCKET SERVER - Realtime Sync
  # ──────────────────────────────────────────────
  reverb_cibenda:
    build: .
    container_name: cibenda_reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080 --debug
    ports:
      - "8080:8080"
    env_file:
      - .env.docker
    environment:
      - DB_HOST=db_cibenda
      - DB_PORT=3306
      - DB_DATABASE=cibenda_mart
      - DB_USERNAME=cibenda_user
      - DB_PASSWORD=${DB_PASSWORD}
      - REVERB_SERVER_HOST=reverb_cibenda
      - REVERB_HOST=reverb_cibenda
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
    depends_on:
      db_cibenda:
        condition: service_healthy
      app_cibenda:
        condition: service_started

volumes:
  db_data:       # Tempat nyimpen data MySQL secara fisik
  storage_data:  # Tempat nyimpen file upload Laravel
